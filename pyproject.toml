[project]
name = "recruiter-scheduling-agent"
version = "0.1.0"
description = "Chat agent that books a call with a tech recruiter through a LangGraph state machine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.5",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.19",
    "openai>=3.45.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduling_agent"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real OpenAI API and needs OPENAI_API_KEY"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
